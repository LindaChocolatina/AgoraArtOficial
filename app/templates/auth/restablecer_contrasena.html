{% extends "base.html" %}
{% block title %}Nueva contraseña — Ágora Art{% endblock %}

{% block content %}
<div style="min-height:75vh;display:flex;align-items:center;justify-content:center;background:#FAFAFA;padding:48px 24px;">
    <div style="width:100%;max-width:440px;">
        <div style="text-align:center;margin-bottom:32px;">
            <h1 style="font-size:1.5rem;margin-bottom:4px;">Nueva contraseña</h1>
            <p style="color:#8C8C8C;font-size:14px;margin:0;">Elige una contraseña segura (mínimo 6 caracteres)</p>
        </div>
        <div style="background:white;border:1px solid #ECECEC;border-radius:12px;padding:32px;">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div style="margin-bottom:16px;">
                    <label style="display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:#4A4A4A;">Nueva contraseña</label>
                    <input type="password" class="form-control" name="password_nueva" required minlength="6" autocomplete="new-password">
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:#4A4A4A;">Confirmar contraseña</label>
                    <input type="password" class="form-control" name="password_confirmar" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:10px;font-size:14px;">Guardar contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
