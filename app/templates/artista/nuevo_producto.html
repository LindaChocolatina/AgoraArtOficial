{% extends "base.html" %}

{% block title %}Nuevo Producto - Ágora Art{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h3 class="mb-4">Nuevo producto</h3>
                    <form method="POST" action="{{ url_for('artista.nuevo_producto') }}" enctype="multipart/form-data">
                        {% include 'artista/_csrf.html' %}
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="precio" class="form-label">Precio (MXN) *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="precio" name="precio" required>
                            </div>
                            <div class="col-md-6">
                                <label for="stock" class="form-label">Stock en inventario *</label>
                                <input type="number" class="form-control" id="stock" name="stock" value="1" min="0" required>
                                <div class="form-text">Se guarda en la base de datos; al vender baja automáticamente.</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="imagen_archivo" class="form-label">Foto del producto</label>
                            <input type="file" class="form-control" id="imagen_archivo" name="imagen_archivo" accept="image/*">
                        </div>
                        <div class="mb-4">
                            <label for="imagen" class="form-label">O URL de imagen (opcional)</label>
                            <input type="url" class="form-control" id="imagen" name="imagen" placeholder="https://...">
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar producto</button>
                        <a href="{{ url_for('artista.productos') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
