{% extends "base.html" %}

{% block title %}Nueva Obra - Ágora Art{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">Nueva Obra</h3>
                        <a href="{{ url_for('artista.obras') }}" class="btn btn-sm btn-outline-secondary">Volver</a>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('artista.nueva_obra') }}" enctype="multipart/form-data">
                        {% include 'artista/_csrf.html' %}

                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título de la Obra *</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select class="form-select" id="categoria" name="categoria">
                                    <option value="">Selecciona una categoría...</option>
                                    {% for cat in categorias %}
                                        <option value="{{ cat.id_categoria }}">{{ cat.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="tecnica" class="form-label">Técnica</label>
                                <input type="text" class="form-control" id="tecnica" name="tecnica" placeholder="Ej: Óleo sobre lienzo">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="imagenes" class="form-label fw-bold">Fotos de la obra *</label>
                            <input type="file" class="form-control" id="imagenes" name="imagenes" accept="image/*" multiple>
                            <div class="form-text">Puedes elegir varias imágenes. La primera será la portada.</div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="visible" name="visible" checked>
                            <label class="form-check-label" for="visible">Visible en la galería pública</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Guardar Obra</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
