{% extends "base.html" %}

{% block title %}Editar Obra - Ágora Art{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">Editar obra</h3>
                    {% if obra.imagen %}
                    <p class="small text-muted">Portada actual:</p>
                    <img src="{{ obra.imagen }}" alt="" class="img-fluid rounded mb-3" style="max-height:180px;">
                    {% endif %}
                    {% if galeria %}
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        {% for img in galeria %}
                        <img src="{{ img.imagen }}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:6px;">
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('artista.editar_obra', obra_id=obra.id_obra) }}" enctype="multipart/form-data">
                        {% include 'artista/_csrf.html' %}
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título *</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" value="{{ obra.titulo }}" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select class="form-select" id="categoria" name="categoria">
                                    <option value="">Sin categoría</option>
                                    {% for cat in categorias %}
                                    <option value="{{ cat.id_categoria }}" {% if obra.id_categoria == cat.id_categoria %}selected{% endif %}>{{ cat.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="tecnica" class="form-label">Técnica</label>
                                <input type="text" class="form-control" id="tecnica" name="tecnica" value="{{ obra.tecnica or '' }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4">{{ obra.descripcion or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="imagenes" class="form-label">Añadir más fotos</label>
                            <input type="file" class="form-control" id="imagenes" name="imagenes" accept="image/*" multiple>
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="visible" name="visible" {% if obra.visible %}checked{% endif %}>
                            <label class="form-check-label" for="visible">Visible en galería</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a href="{{ url_for('artista.obras') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
