{% extends "base.html" %}
{% block title %}Nueva Entrada - Ágora Art{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4">Nueva entrada de blog</h2>
            {% include 'artista/_panel_nav.html' %}
            <form method="POST" action="{{ url_for('artista.nueva_entrada') }}" data-blog-upload="{{ url_for('artista.subir_imagen_blog') }}">
                {% include 'artista/_csrf.html' %}
                <div class="mb-3">
                    <label class="form-label">Título *</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contenido *</label>
                    <div id="editor-contenido"></div>
                    <input type="hidden" name="contenido" id="contenido-input">
                </div>
                {% include 'artista/_editor_blog.html' %}
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="publicado" id="publicado" checked>
                    <label class="form-check-label" for="publicado">Publicar ahora</label>
                </div>
                <button type="submit" class="btn btn-primary">Publicar</button>
                <a href="{{ url_for('artista.blog') }}" class="btn btn-secondary ms-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
