{% extends "base.html" %}
{% block title %}Nueva Entrada{% endblock %}
{% block content %}
<div class="container mt-5">
  <h2>Crear Nueva Entrada de Blog</h2>
  <form method="post" action="{{ url_for('artista.nueva_entrada') }}">
    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" name="titulo" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Contenido</label>
      <textarea name="contenido" class="form-control" rows="6" required></textarea>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="publicado" id="publicado">
      <label class="form-check-label" for="publicado">Publicar</label>
    </div>
    <button type="submit" class="btn btn-primary">Crear Entrada</button>
    <a href="{{ url_for('artista.blog') }}" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>
{% endblock %}
