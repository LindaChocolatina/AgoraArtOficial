{% extends "base.html" %}

{% block title %}Editar Entrada - Ágora Art{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4">Editar entrada</h2>
            <form method="POST" action="{{ url_for('artista.editar_entrada', entrada_id=entrada.id_entrada) }}">
                {% include 'artista/_csrf.html' %}
                <div class="mb-3">
                    <label class="form-label">Título *</label>
                    <input type="text" name="titulo" class="form-control" required value="{{ entrada.titulo }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contenido *</label>
                    <textarea id="contenido-initial" class="d-none">{{ entrada.contenido }}</textarea>
                    <div id="editor-contenido"></div>
                    <input type="hidden" name="contenido" id="contenido-input">
                </div>
                {% include 'artista/_editor_blog.html' %}
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="publicado" id="publicado" {% if entrada.visible %}checked{% endif %}>
                    <label class="form-check-label" for="publicado">Publicado</label>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('artista.blog') }}" class="btn btn-secondary ms-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
